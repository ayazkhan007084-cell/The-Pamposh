<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Pamposh Electricals</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<style>
body{margin:0;font-family:Arial;background:#020617;color:#fff}
header{text-align:center;padding:25px;background:#020617}
.section{max-width:1200px;margin:auto;padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}
.card{background:#020617;border:1px solid #1e293b;padding:12px;border-radius:12px}
img{width:100%;height:160px;object-fit:cover;border-radius:10px}
button{background:#22c55e;border:none;padding:8px 14px;border-radius:8px;font-weight:bold;cursor:pointer}
input,select{width:100%;padding:8px;margin:6px 0;border-radius:6px;border:none}
.cart{position:fixed;right:10px;bottom:10px;background:#020617;padding:15px;border-radius:12px;width:300px}
.qr{background:#fff;padding:10px;border-radius:10px;text-align:center}
a{color:#22c55e;text-decoration:none}
</style>
</head>

<body>

<header>
<h1>The Pamposh Electricals ⚡</h1>
<p><b>A-Class Electrical Contractor – Jammu & Kashmir</b></p>
<p>
📧 thepamposhelectricals@gmail.com |
📷 <a href="https://instagram.com/thepamposhelectricals" target="_blank">@thepamposhelectricals</a>
</p>
</header>

<section class="section">
<h2>Products</h2>
<select id="categoryFilter" onchange="renderProducts()">
<option value="All">All Categories</option>
<option>Fan</option>
<option>LED</option>
<option>Switch</option>
<option>Wire</option>
<option>Flood Light</option>
<option>Panel</option>
</select>
<div class="grid" id="productsDiv"></div>
</section>

<section class="section" id="loginBox" style="display:none">
<h2>Customer Details</h2>
<input id="name" placeholder="Full Name">
<input id="phone" placeholder="Phone Number">
<input id="address" placeholder="Complete Address">
<button onclick="saveUser()">Save Details</button>
</section>

<div class="cart">
<h3>Cart</h3>
<div id="cartItems"></div>
<p><b>Total: ₹<span id="total">0</span></b></p>
<button onclick="checkout()">Checkout</button>

<div id="paymentBox" style="display:none">
<h4>Pay via UPI / Razorpay</h4>
<div class="qr">
<img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=upi://pay?pa=aban007084@okhdfcbank&pn=The%20Pamposh%20Electricals">
<p style="color:#000"><b>aban007084@okhdfcbank</b></p>
</div>
<button onclick="payRazorpay()">Pay with Razorpay</button>
<button onclick="finalizeOrder()">I Have Paid</button>
</div>
</div>

<script>
const products=[
{category:"Fan",name:"Bajaj Regal Gold Ceiling Fan",price:4200,img:"https://images.unsplash.com/photo-1621905251918-48416bd8575a"},
{category:"Fan",name:"Anchor Prima High Speed Fan",price:3900,img:"https://images.unsplash.com/photo-1604014237800-1c9102c219da"},
{category:"LED",name:"Havells 18W LED Panel Light",price:950,img:"https://images.unsplash.com/photo-1581093588401-22d1e6f8b9f9"},
{category:"Switch",name:"Anchor Roma Modular Switch Set",price:850,img:"https://images.unsplash.com/photo-1586864387789-628af9feed72"},
{category:"Wire",name:"Polycab FR Copper Wire 1.5sqmm",price:2200,img:"https://images.unsplash.com/photo-1603808033192-082d6919d3e1"},
{category:"Flood Light",name:"Philips 50W LED Flood Light",price:2800,img:"https://images.unsplash.com/photo-1602526219049-6e42d0f8b1c3"},
{category:"Panel",name:"LT Electrical Distribution Panel",price:15000,img:"https://images.unsplash.com/photo-1581090700227-1e37b190418e"}
];

let cart=[],total=0;

function renderProducts(){
productsDiv.innerHTML="";
let f=categoryFilter.value;
products.filter(p=>f==="All"||p.category===f).forEach((p,i)=>{
productsDiv.innerHTML+=`
<div class="card">
<img src="${p.img}">
<h4>${p.name}</h4>
<small>${p.category}</small>
<p><b>₹${p.price}</b></p>
<button onclick="addToCart(${i})">Add to Cart</button>
</div>`;
});
}
renderProducts();

function addToCart(i){
cart.push(products[i]);
updateCart();
loginBox.style.display="block";
}

function updateCart(){
cartItems.innerHTML="";
total=0;
cart.forEach(p=>{cartItems.innerHTML+=`${p.name}<br>`;total+=p.price});
document.getElementById("total").innerText=total;
}

function saveUser(){
if(!name.value||!phone.value||!address.value){
alert("Please fill all customer details");
return;
}
localStorage.setItem("customer",JSON.stringify({
name:name.value,phone:phone.value,address:address.value
}));
alert("Customer details saved successfully");
}

function checkout(){
if(!localStorage.getItem("customer")){
alert("Please save customer details first");
return;
}
paymentBox.style.display="block";
}

function finalizeOrder(){
let c=JSON.parse(localStorage.getItem("customer"));
let msg=`📄 *NEW ORDER – THE PAMPOSH ELECTRICALS*%0A
👤 ${c.name}%0A📞 ${c.phone}%0A📍 ${c.address}%0A%0A`;
cart.forEach(p=>msg+=`• ${p.name} – ₹${p.price}%0A`);
msg+=`%0A💰 Total: ₹${total}`;
window.open(`https://wa.me/919419007084?text=${msg}`,"_blank");
}

function payRazorpay(){
new Razorpay({
key:"PASTE_YOUR_RAZORPAY_KEY_ID",
amount:total*100,
currency:"INR",
name:"The Pamposh Electricals",
handler:function(){alert("Payment successful")}
}).open();
}
</script>

</body>
</html>
