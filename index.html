<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Pamposh Electricals</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{margin:0;font-family:-apple-system,system-ui;background:#f4f4f4}
header{background:#fff;padding:16px;text-align:center;border-bottom:1px solid #ddd}
.container{padding:14px}
.card{background:#fff;border-radius:16px;padding:12px;margin-bottom:14px;
box-shadow:0 6px 14px rgba(0,0,0,.06)}
.card img{width:100%;height:160px;object-fit:cover;border-radius:12px}
button{width:100%;padding:12px;border:none;border-radius:12px;background:#111;color:#fff;font-size:16px}
.qty{display:flex;justify-content:center;gap:14px;margin-top:10px}
.qty button{width:44px;font-size:20px}
.checkout-btn{position:fixed;bottom:18px;right:18px;
background:#111;color:#fff;padding:14px 24px;border-radius:30px}
.summary{background:#fff;border-radius:16px;padding:14px;margin-bottom:16px}
</style>
</head>

<body>

<header>
<h2>The Pamposh Electricals</h2>
<small>Class A Electrical Contractor | Jammu & Kashmir</small><br>
<small><a href="https://instagram.com/thepamposhelectricals" target="_blank">@thepamposhelectricals</a></small>
</header>

<div class="container">

<div class="summary" id="orderSummary">
<b>Order Summary</b><br><br>
<small>No items added</small>
</div>

<div id="products"></div>
</div>

<div class="checkout-btn" onclick="openCheckout()">Checkout 🛒</div>

<script>
const products=[
{name:"Bajaj Ceiling Fan 1200mm",price:2899,img:"https://images.unsplash.com/photo-1581090700227-1e37b190418e"},
{name:"Havells LED Panel Light 24W",price:799,img:"https://images.unsplash.com/photo-1509395176047-4a66953fd231"},
{name:"Anchor Roma Modular Switch",price:149,img:"https://images.unsplash.com/photo-1581093588401-22a8f0d1c07a"},
{name:"Polycab Copper Wire 1.5 sqmm",price:3299,img:"https://images.unsplash.com/photo-1581091870627-3c79b1a8f1b1"}
];

let cart={};
const box=document.getElementById("products");

products.forEach((p,i)=>{
box.innerHTML+=`
<div class="card">
<img src="${p.img}">
<h4>${p.name}</h4>
<b>₹${p.price}</b>
<div id="ctrl${i}">
<button onclick="add(${i})">Add to Cart</button>
</div>
</div>`;
});

function add(i){cart[i]=1;render(i);updateSummary()}
function inc(i){cart[i]++;render(i);updateSummary()}
function dec(i){
cart[i]--;
if(cart[i]<=0){delete cart[i];reset(i)}
else render(i);
updateSummary();
}
function render(i){
document.getElementById("ctrl"+i).innerHTML=
`<div class="qty">
<button onclick="dec(${i})">−</button>
<b>${cart[i]}</b>
<button onclick="inc(${i})">+</button>
</div>`;
}
function reset(i){
document.getElementById("ctrl"+i).innerHTML=
`<button onclick="add(${i})">Add to Cart</button>`;
}

function updateSummary(){
let div=document.getElementById("orderSummary");
let sub=0,html="<b>Order Summary</b><br><br>";

if(Object.keys(cart).length===0){
div.innerHTML=html+"<small>No items added</small>";
return;
}

for(let i in cart){
let line=products[i].price*cart[i];
sub+=line;
html+=products[i].name+" × "+cart[i]+" = ₹"+line+"<br>";
}
let gst=sub*0.18;
let total=sub+gst;

html+="<hr>GST (18%): ₹"+gst.toFixed(2);
html+="<br><b>Total: ₹"+total.toFixed(2)+"</b>";

div.innerHTML=html;
}

function openCheckout(){
if(Object.keys(cart).length===0){alert("Cart is empty");return;}

const w=window.open("", "_blank");
w.document.write(`
<!DOCTYPE html>
<html>
<head>
<title>Checkout</title>
<style>
body{font-family:-apple-system,system-ui;background:#f4f4f4;padding:14px}
.card{background:#fff;border-radius:16px;padding:14px}
input,button{width:100%;padding:12px;margin-bottom:10px;border-radius:10px}
button{background:#111;color:#fff;border:none}
</style>
</head>
<body>

<div class="card">
<h3>Customer Details</h3>

<input id="name" placeholder="Full Name">
<input id="phone" placeholder="Mobile Number">
<input id="address" placeholder="Address">

<button onclick="pay()">Generate QR & Invoice</button>
<button onclick="window.close()">Close Checkout</button>
</div>

<script>
const { jsPDF } = window.jspdf;
const cart=${JSON.stringify(cart)};
const products=${JSON.stringify(products)};

function pay(){
const n=name.value.trim(),p=phone.value.trim(),a=address.value.trim();
if(!n||!p||!a){alert("Fill all details");return;}

let sub=0,txt="Invoice – The Pamposh Electricals\\n\\n";
txt+="Name: "+n+"\\nPhone: "+p+"\\nAddress: "+a+"\\n\\n";

for(let i in cart){
let l=products[i].price*cart[i];
sub+=l;
txt+=products[i].name+" x "+cart[i]+" = ₹"+l+"\\n";
}
let gst=sub*0.18,total=sub+gst;
txt+="\\nGST (18%): ₹"+gst.toFixed(2);
txt+="\\nTotal: ₹"+total.toFixed(2);

const pdf=new jsPDF();
pdf.text(txt,10,10);
pdf.save("Pamposh-Electricals-Invoice.pdf");

const msg=encodeURIComponent(txt);
window.open("https://wa.me/919419007084?text="+msg,"_blank");

window.open(
"https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=upi://pay?pa=aban007084@okhdfcbank&pn=The%20Pamposh%20Electricals&am="+total.toFixed(2)+"&cu=INR",
"_blank"
);
}
<\/script>

</body>
</html>
`);
}
</script>

</body>
</html>
