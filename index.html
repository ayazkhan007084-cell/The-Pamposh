<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Pamposh Electricals</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- jsPDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<!-- Razorpay -->
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<style>
body{margin:0;font-family:Arial;background:#020617;color:#fff}
header{text-align:center;padding:25px;background:#020617}
.section{max-width:1200px;margin:auto;padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}
.card{background:#020617;border:1px solid #1e293b;padding:12px;border-radius:12px}
img{width:100%;height:160px;object-fit:cover;border-radius:10px}
button{background:#22c55e;border:none;padding:8px 14px;border-radius:8px;font-weight:bold;cursor:pointer}
input,select{width:100%;padding:8px;margin:6px 0;border-radius:6px;border:none}
.cart{position:fixed;right:10px;bottom:10px;background:#020617;padding:15px;border-radius:12px;width:300px}
.qr{background:#fff;padding:10px;border-radius:10px;text-align:center}
.admin{white-space:pre-wrap;background:#020617;border:1px solid #1e293b;padding:15px;border-radius:10px}
small{opacity:0.7}
</style>
</head>

<body>

<header>
<h1>The Pamposh Electricals ⚡</h1>
<p>Class Contractor – Jammu & Kashmir</p>
<p>📧 thepamposhelectricals@gmail.com | 📷 @thepamposhelectricals</p>
</header>

<section class="section">
<h2>Products</h2>
<select id="categoryFilter" onchange="renderProducts()">
<option value="All">All Categories</option>
<option>LED</option><option>Fan</option><option>Switch</option>
<option>Wire</option><option>Flood Light</option><option>Panel</option>
</select>
<div class="grid" id="productsDiv"></div>
</section>

<section class="section" id="loginBox" style="display:none">
<h2>Customer Details</h2>
<input id="name" placeholder="Full Name">
<input id="phone" placeholder="Phone Number">
<input id="address" placeholder="Address">
<button onclick="saveUser()">Save & Continue</button>
</section>

<div class="cart">
<h3>Cart</h3>
<div id="cartItems"></div>
<p><b>Total: ₹<span id="total">0</span></b></p>
<button onclick="checkout()">Checkout</button>

<div id="paymentBox" style="display:none">
<h4>UPI Payment</h4>
<div class="qr">
<img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=upi://pay?pa=aban007084@okhdfcbank&pn=The%20Pamposh%20Electricals">
<p style="color:#000"><b>aban007084@okhdfcbank</b></p>
</div>
<button onclick="payWithRazorpay()">Pay with Razorpay</button>
<button onclick="finalizeOrder()">I Have Paid (Send Order)</button>
</div>
</div>

<section class="section">
<h2>Admin – Order History</h2>
<button onclick="viewOrders()">View Orders</button>
<div id="ordersBox" class="admin"></div>
</section>

<script>
const categories=["LED","Fan","Switch","Wire","Flood Light","Panel"];
const images={
"LED":"https://images.unsplash.com/photo-1581093588401-22d1e6f8b9f9",
"Fan":"https://images.unsplash.com/photo-1621905251918-48416bd8575a",
"Switch":"https://images.unsplash.com/photo-1586864387789-628af9feed72",
"Wire":"https://images.unsplash.com/photo-1603808033192-082d6919d3e1",
"Flood Light":"https://images.unsplash.com/photo-1602526219049-6e42d0f8b1c3",
"Panel":"https://images.unsplash.com/photo-1581090700227-1e37b190418e"
};

const products=[];
for(let i=1;i<=120;i++){
let c=categories[i%6];
products.push({name:`${c} Product ${i}`,price:Math.floor(600+Math.random()*4000),category:c});
}

let cart=[],totalAmt=0;

function renderProducts(){
productsDiv.innerHTML="";
let f=categoryFilter.value;
products.filter(p=>f==="All"||p.category===f).forEach((p,i)=>{
productsDiv.innerHTML+=`
<div class="card">
<img src="${images[p.category]}">
<h4>${p.name}</h4>
<small>${p.category}</small>
<p><b>₹${p.price}</b></p>
<button onclick="addToCart(${i})">Add to Cart</button>
</div>`;
});
}
renderProducts();

function addToCart(i){
cart.push(products[i]);
updateCart();
loginBox.style.display="block";
}

function updateCart(){
cartItems.innerHTML="";
totalAmt=0;
cart.forEach(p=>{cartItems.innerHTML+=`${p.name}<br>`;totalAmt+=p.price;});
total.innerText=totalAmt;
}

function saveUser(){
if(!name.value||!phone.value||!address.value){alert("Fill all details");return;}
localStorage.setItem("user",JSON.stringify({name:name.value,phone:phone.value,address:address.value}));
alert("Saved");
}

function checkout(){
if(!localStorage.getItem("user")){alert("Enter customer details first");return;}
paymentBox.style.display="block";
generateInvoice();
}

function generateInvoice(){
const {jsPDF}=window.jspdf;
const pdf=new jsPDF();
let u=JSON.parse(localStorage.getItem("user"));
pdf.text("THE PAMPOSH ELECTRICALS",20,20);
pdf.text("GST INVOICE",20,30);
pdf.text(`Name: ${u.name}`,20,45);
pdf.text(`Phone: ${u.phone}`,20,55);
pdf.text(`Address: ${u.address}`,20,65);
let y=80;
cart.forEach(p=>{pdf.text(`${p.name} - ₹${p.price}`,20,y);y+=8;});
let gst=totalAmt*0.18;
pdf.text(`Subtotal: ₹${totalAmt}`,20,y+10);
pdf.text(`GST (18%): ₹${gst.toFixed(2)}`,20,y+20);
pdf.text(`Total: ₹${(totalAmt+gst).toFixed(2)}`,20,y+30);
pdf.save("Pamposh_GST_Invoice.pdf");
}

function saveOrder(order){
let orders=JSON.parse(localStorage.getItem("orders")||"[]");
orders.push(order);
localStorage.setItem("orders",JSON.stringify(orders));
}

function finalizeOrder(){
let u=JSON.parse(localStorage.getItem("user"));
let order={user:u,items:cart,total:totalAmt,date:new Date().toLocaleString()};
saveOrder(order);

let msg=`📄 *PAID ORDER – THE PAMPOSH ELECTRICALS*%0A👤 ${u.name}%0A📞 ${u.phone}%0A📍 ${u.address}%0A%0A`;
cart.forEach(p=>msg+=`• ${p.name} – ₹${p.price}%0A`);
msg+=`%0A💰 Paid: ₹${totalAmt}`;
window.open(`https://wa.me/919419007084?text=${msg}`,"_blank");
}

function viewOrders(){
let orders=JSON.parse(localStorage.getItem("orders")||"[]");
ordersBox.innerText="";
orders.forEach((o,i)=>{
ordersBox.innerText+=`ORDER ${i+1}
Name: ${o.user.name}
Phone: ${o.user.phone}
Total: ₹${o.total}
Date: ${o.date}
Items: ${o.items.map(x=>x.name).join(", ")}

------------------------
`;
});
}

function payWithRazorpay(){
var options={
"key":"PASTE_YOUR_RAZORPAY_KEY_ID_HERE",
"amount":totalAmt*100,
"currency":"INR",
"name":"The Pamposh Electricals",
"handler":function(){alert("Payment Successful");}
};
new Razorpay(options).open();
}
</script>

</body>
</html>
