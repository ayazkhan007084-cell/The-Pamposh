<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Pamposh Electricals</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,sans-serif}
body{background:#f4f6f8;color:#222}
header{background:#0b1c2d;color:#fff;padding:15px 30px;display:flex;justify-content:space-between;align-items:center}
.cart-btn{background:gold;border:none;padding:8px 14px;border-radius:20px;font-weight:bold;cursor:pointer}
.hero{background:linear-gradient(135deg,#0b1c2d,#123a5c);color:#fff;text-align:center;padding:80px 20px}
.section{padding:60px 20px;max-width:1100px;margin:auto}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:25px}
.product{background:#fff;border-radius:12px;box-shadow:0 6px 18px rgba(0,0,0,.1);overflow:hidden;text-align:center}
.product img{width:100%;height:180px;object-fit:cover}
.product-content{padding:20px}
.price{color:#0b7a0b;font-size:20px;font-weight:bold;margin:10px 0}
.add-btn{background:#0b1c2d;color:white;border:none;padding:10px 15px;border-radius:6px;cursor:pointer}
footer{background:#0b1c2d;color:white;padding:40px 20px;margin-top:40px;text-align:center}
.cart-panel{position:fixed;right:-350px;top:0;width:350px;height:100%;background:white;box-shadow:-5px 0 20px rgba(0,0,0,.2);padding:20px;transition:.4s;overflow-y:auto}
.cart-panel.active{right:0}
</style>
</head>
<body>

<header>
  <h1>The Pamposh Electricals</h1>
  <button class="cart-btn" onclick="toggleCart()">🛒 (<span id="cart-count">0</span>)</button>
</header>

<section class="hero">
  <h2>Powering Kashmir with Excellence ⚡</h2>
  <p>A-Class Government Registered Electrical Contractor</p>
</section>

<section class="section">
  <h3>Our Products</h3>
  <div class="products" id="product-list"></div>
</section>

<div class="cart-panel" id="cartPanel">
  <h3>Your Cart</h3>
  <div id="cart-items"></div>
  <h4>Total: ₹<span id="cart-total">0</span></h4>
</div>

<footer>
📍 India, Kashmir, Srinagar, Red Cross Road, Lal Chowk – 190015<br>
📧 thepamposhelectricals@gmail.com<br><br>
© 2026 The Pamposh Electricals
</footer>

<script>
let defaultProducts=[
 {name:"LED Panel Lights",price:1250,img:"https://images.unsplash.com/photo-1581092580497-e0d23cbdf1dc"},
 {name:"MCB & Switches",price:450,img:"https://images.unsplash.com/photo-1616627987854-3d2e6e8b7a02"}
];

let products=JSON.parse(localStorage.getItem("products"))||defaultProducts;

function displayProducts(){
  const list=document.getElementById("product-list");
  list.innerHTML="";
  products.forEach(p=>{
    list.innerHTML+=`
    <div class="product">
      <img src="${p.img}">
      <div class="product-content">
        <h4>${p.name}</h4>
        <div class="price">₹ ${p.price}</div>
        <button class="add-btn" onclick="addToCart('${p.name}',${p.price})">Add to Cart</button>
      </div>
    </div>`;
  });
}
displayProducts();

let cart=[];
function addToCart(name,price){
 const item=cart.find(p=>p.name===name);
 if(item)item.qty++;else cart.push({name,price,qty:1});
 updateCart();
}
function updateCart(){
 let items=document.getElementById("cart-items"),count=0,total=0;
 items.innerHTML="";
 cart.forEach(i=>{
   total+=i.price*i.qty;count+=i.qty;
   items.innerHTML+=`${i.name} x${i.qty} - ₹${i.price*i.qty}<br>`;
 });
 document.getElementById("cart-count").textContent=count;
 document.getElementById("cart-total").textContent=total;
}
function toggleCart(){document.getElementById("cartPanel").classList.toggle("active")}
</script>

</body>
</html>
